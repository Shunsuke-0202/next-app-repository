name: CI

# このワークフローはリポジトリの最低限の品質チェックを行う。
# 目的: 構造破壊や基本的な静的チェックの早期発見。
on:
  # main / master への push で実行
  push:
    branches: [main, master]
  # PR でも実行
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repo structure
        run: |
          # リポジトリ構造の基本ルールを確認する
          bash .github/scripts/validate-repo.sh

      - name: Run lint checks
        run: |
          # シンプルな静的チェックを実行する
          bash .github/scripts/lint.sh

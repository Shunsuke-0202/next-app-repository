name: Prompt file checks

# プロンプト関連ファイルの整合性を確認するための CI です。
# 目的: system prompt や LLM 運用ドキュメントの破損やルール逸脱を検出する。
on:
  # プロンプト関連ファイルが変更された PR でだけ実行
  pull_request:
    paths:
      - '.github/system_prompt.txt'
      - 'docs/prompting_system_prompt.md'
      - 'docs/prompting.md'
      - 'docs/runbooks/ai.md'

jobs:
  check-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run system prompt checks
        run: |
          # プロンプトのルールと整合性チェックを実行
          chmod +x .github/scripts/check-system-prompt.sh || true
          bash .github/scripts/check-system-prompt.sh
